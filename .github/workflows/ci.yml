name: CI

# Roda em todo PR para develop ou main. Os jobs daqui devem ser marcados
# como "required status checks" na protecao das branches.
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "<1.14.0"
  AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}

jobs:
  fluxo-branches:
    name: Trava de fluxo de branches
    runs-on: ubuntu-latest
    steps:
      - name: Validar origem do PR
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          if [ "$BASE" = "main" ]; then
            case "$HEAD" in
              develop|hotfix/*) ;;
              *) echo "::error::PRs para main (PROD) so podem vir de develop ou hotfix/*. Origem: $HEAD"; exit 1 ;;
            esac
          fi
          if [ "$BASE" = "develop" ]; then
            case "$HEAD" in
              feature/*|fix/*|hotfix/*|main) ;;
              *) echo "::error::PRs para develop devem vir de feature/*, fix/* ou hotfix/*. Origem: $HEAD"; exit 1 ;;
            esac
          fi

  python:
    name: Python (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Erros de sintaxe e nomes indefinidos
        run: ruff check src --select E9,F63,F7,F82 --output-format=github
      - name: Compilar
        run: python -m compileall -q src

  terraform:
    name: Terraform (validate + plan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: infra
    env:
      AMBIENTE: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}
      TF_VAR_proxy_url: ${{ github.base_ref == 'main' && secrets.PROXY_URL_PROD || secrets.PROXY_URL_DEV }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Formatacao
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -input=false -backend=false
          terraform validate

      - name: Credenciais AWS (somente leitura)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-athenas-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan (${{ env.AMBIENTE }})
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="envs/${AMBIENTE}.backend.hcl" \
            -backend-config="bucket=athenas-tfstate-${{ vars.AWS_ACCOUNT_ID }}"
          # -lock=false: a role de plan e somente leitura e nao grava o lock.
          terraform plan -input=false -lock=false -no-color \
            -var-file="envs/${AMBIENTE}.tfvars" | tee plan.txt
          {
            echo "### Terraform plan - ${AMBIENTE}"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
